# NOTE: this workflow has been written but NOT executed on GitHub (no repository was available while it was authored).
# The same commands were run locally on Windows. Expect to adjust runner-specific details on the first run.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 2 * * *' # nightly: disaster-recovery drill

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Dependency audit (production dependencies, high and above fail the build)
        run: npm audit --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

  dr-drill:
    # Real-PostgreSQL backup / crash / PITR / restore drill with the full suite run against the restored server (about 3 minutes).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run dr:drill
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dr-test-report
          path: |
            docs/dr-test-report.md
            docs/dr-test-report.json
