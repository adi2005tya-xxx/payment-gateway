# Render blueprint for the Gateway API (backend/). The website (web/) is deployed separately on Vercel.
# Secrets marked sync: false are asked for in the Render dashboard and never stored in git.
services:
  - type: web
    name: gateway-api
    runtime: node
    rootDir: backend
    plan: free # free instances sleep after inactivity; use a paid plan before relying on webhooks
    # NODE_ENV=production makes npm skip devDependencies, but the TypeScript build needs them.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /pay/done
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: PAYMENT_MODE
        value: sandbox
      - key: PROVIDER_KIND
        value: razorpay
      - key: DATABASE_URL
        fromDatabase:
          name: gateway-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PROVIDER_WEBHOOK_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY # must be base64 of exactly 32 bytes
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_BASE_URL # this service's own https URL, e.g. https://gateway-api.onrender.com
        sync: false
      - key: WEB_BASE_URL
        value: https://payment-gateway-h1xz.vercel.app
      - key: WEB_ORIGIN
        value: https://payment-gateway-h1xz.vercel.app

databases:
  - name: gateway-db
    plan: free # Render's free Postgres expires after 30 days; upgrade before keeping real data
